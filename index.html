<!DOCTYPE html>
 <html lang="zh-CN">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>南工程 · 奶龙&奶蛙爱好者站</title>
     <style>
         * {
             box-sizing: border-box;
             font-family: system-ui, sans-serif;
         }
         body {
             background: #fff;
             max-width: 700px;
             margin: 20px auto;
             padding: 15px;
         }
         .box {
             background-color: #fff8dc;
             border-radius: 18px;
             padding:20px;
             margin-bottom:20px;
             text-align:center;
         }
         .btn-yellow{
             background:#ffd140;
             border:none;
             padding:16px 60px;
             border-radius:12px;
             font-size:20px;
             font-weight:bold;
             margin:8px;
         }
         .btn-green{
             background:#7cd184;
             border:none;
             padding:16px 60px;
             border-radius:12px;
             font-size:20px;
             font-weight:bold;
             margin:8px;
         }
         .tip-text{
             color:#666;
             font-size:15px;
         }
         img{
             max-width:240px;
             border-radius:12px;
             margin:10px auto;
             display:block;
         }
         input{
             font-size:20px;
             padding:12px;
             width:80%;
             border:2px solid #ffdd70;
             border-radius:10px;
             margin:10px 0;
         }
     </style>
 </head>
 <body>
     <div class="box">
         <button class="btn-yellow">🐉 投奶龙</button>
         <br>
         <button class="btn-green">🐸 投奶蛙</button>
         <p class="tip-text">每位访客仅可投一票</p >
     </div>
     <div class="box">
         <h2>📌什么是奶系生物？</h2>
         < img src="nailong.jpg" alt="奶龙">
         <p>奶龙：人气爆棚的黄色小龙，性格天真活泼，可爱魔性，表情包出圈，全网超高热度。</p >
         < img src="naiwa.jpg" alt="奶蛙">
         <p>奶蛙：似龙非龙、似蛙非蛙的神秘生物，呆萌又有梗，是大家快乐整活的重要搭子。</p >
         <p>奶龙和奶蛙一起，组成了南工程同学之间轻松、可爱、爱整活的快乐氛围。</p >
     </div>
     <div class="box">
         <h2>📢入群通道</h2>
         <p>1群已满，可私信主播QQ：3964613553，拉你进新群</p >
     </div>
     <div class="box">
         <h2>🎂输入你的生日解锁专属奶蛙</h2>
         <p>输入生日，获取对应星座专属奶蛙形象</p >
         <input type="date" id="birth">
         <br>
         <button class="btn-green" onclick="showConstellation()">解锁专属奶蛙</button>
         <div id="result"></div>
     </div>
 <script>
 function showConstellation(){
     const birth = document.getElementById("birth").value;
     if(!birth){
         alert("请选择生日");
         return;
     }
     const m = parseInt(birth.split("-")[1]);
     const d = parseInt(birth.split("-")[2]);
     let pic="",name="";
     if((m==1&&d>=20)||(m==2&&d<=18)){pic="aquarius.jpg";name="水瓶座奶蛙";}
     else if((m==2&&d>=19)||(m==3&&d<=20)){pic="pisces.jpg";name="双鱼座奶蛙";}
     else if((m==3&&d>=21)||(m==4&&d<=19)){pic="aries.jpg";name="白羊座奶蛙";}
     else if((m==4&&d>=20)||(m==5&&d<=20)){pic="taurus.jpg";name="金牛座奶蛙";}
     else if((m==5&&d>=21)||(m==6&&d<=21)){pic="gemini.jpg";name="双子座奶蛙";}
     else if((m==6&&d>=22)||(m==7&&d<=22)){pic="cancer.jpg";name="巨蟹座奶蛙";}
     else if((m==7&&d>=23)||(m==8&&d<=22)){pic="leo.jpg";name="狮子座奶蛙";}
     else if((m==8&&d>=23)||(m==9&&d<=22)){pic="virgo.jpg";name="处女座奶蛙";}
     else if((m==9&&d>=23)||(m==10&&d<=23)){pic="libra.jpg";name="天秤座奶蛙";}
     else if((m==10&&d>=24)||(m==11&&d<=22)){pic="scorpio.jpg";name="天蝎座奶蛙";}
     else if((m==11&&d>=23)||(m==12&&d<=21)){pic="sagittarius.jpg";name="射手座奶蛙";}
     else{pic="capricorn.jpg";name="摩羯座奶蛙";}
     document.getElementById("result").innerHTML = `
         <h3>${name}</h3>
         < img src="${pic}" alt="${name}">
     `;
 }
 </script>
 </body>
 </html>
